[package]
name = "app"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aes-gcm = "0.11"
# Without its default features, which need tokio's networking, so that axum
# builds for wasm32-unknown-unknown.
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
base64 = "0.23"
futures = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
# tower-sessions' random session ids use getrandom 0.2, which needs `js`
# to read the Workers crypto source.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
# tower-sessions 0.15 draws from getrandom 0.3, which needs `wasm_js` for the
# same reason.
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
hkdf = "0.13"
hmac = "0.13"
hypersig = "0.4.1"
hypersig_ui = "0.4.1"
js-sys = "0.3.106"
openidconnect = { version = "4", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Without the in-memory store and tokio: sessions are kept in D1.
tower-sessions = { version = "0.15", default-features = false, features = ["axum-core"] }
tower-service = "0.3"
url = "2"
# Without `wasm-bindgen`, reading the clock panics on wasm32-unknown-unknown.
time = { version = "0.3", features = ["wasm-bindgen"] }
# `#[durable_object]` expands to wasm-bindgen's macros, whose expansion names
# the `wasm_bindgen` crate by that path.
wasm-bindgen = "0.2"
worker = { version = "0.8", features = ["http", "axum", "d1"] }

[dev-dependencies]
rand = "0.10"
rsa = { version = "0.9", features = ["pem"] }
tower = { version = "0.5", features = ["util"] }

# Clippy's pedantic group adds warnings for code that compiles but hides a
# mistake or reads worse, such as a cast that can lose digits or an argument
# taken by value that is only read. Turn one off by name, such as
# `module_name_repetitions = "allow"`, where it does not fit this project.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
