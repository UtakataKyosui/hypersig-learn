name = "app"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

# worker-build compiles the crate to wasm and writes the JavaScript shim that
# `main` names. `cargo install` does nothing once it is installed.
[build]
command = "sh scripts/build.sh"

# The database the counter is saved in, which the worker reads as `DB`.
# `wrangler dev` keeps it in a local SQLite file under `.wrangler/`. The entry
# names no `database_id`: the deploy workflow writes the id from the GitHub
# secret `D1_DATABASE_ID`, which `scripts/setup-d1.sh` stores.
[[d1_databases]]
binding = "DB"
database_name = "app"

# The `Hub` Durable Object of `src/lib.rs`, which the worker reads as `HUB`.
# A Durable Object on the Free plan has to keep its storage in SQLite, which
# `storage` names, though the hub stores nothing.
[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[exports.Hub]
type = "durable-object"
storage = "sqlite"

# The VAPID public key, private key, and contact address are GitHub secrets
# that the deploy workflow binds to the worker. `scripts/setup-vapid.sh`
# creates them, and `.dev.vars` holds them for `wrangler dev`.

# Every minute, UTC.
[triggers]
crons = ["* * * * *"]
