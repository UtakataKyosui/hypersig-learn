<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect x="0" y="0" width="390" height="844" rx="0" fill="#F6F7F2" stroke="none"/><text x="26" y="30" font-family="Noto Sans JP" font-size="14" font-weight="600">9:41</text><text x="290" y="30" font-family="Noto Sans JP" font-size="14" font-weight="600">•••  ▰</text><text x="24" y="83" font-family="Noto Sans JP" font-size="18" font-weight="700">葉  kusuri</text><text x="24" y="132" font-family="Noto Sans JP" font-size="28" font-weight="700">通知設定</text><text x="24" y="161" font-family="Noto Sans JP" font-size="13" font-weight="400">いつもの端末に、そっとお知らせ。</text>
