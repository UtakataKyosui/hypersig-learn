name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, wasm]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Require the D1 database id
        run: |
          if ! sed -En '/^database_id = "[^"]+"/p' wrangler.toml | read -r _; then
            echo "database_id in wrangler.toml is missing: deploy once by hand and commit it" >&2
            exit 1
          fi
      - name: Require the VAPID settings
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          for name in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do
            if [ -z "$(printenv "$name")" ]; then
              echo "GitHub secret $name is missing: run scripts/setup-vapid.sh" >&2
              exit 1
            fi
          done
      - id: deploy
        uses: cloudflare/wrangler-action@v3
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          vars: |
            VAPID_PUBLIC_KEY
          secrets: |
            VAPID_PRIVATE_KEY
            VAPID_SUBJECT
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$URL" ]; then
            echo "wrangler-action returned no deployment-url" >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$URL/manifest.webmanifest" > /dev/null
