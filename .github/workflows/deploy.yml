name: Deploy

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: worker-release
          cache-all-crates: true
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-wrangler-4.152.0
      - name: Set the D1 database id
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          case "$D1_DATABASE_ID" in
            ????????-????-????-????-????????????) ;;
            *) echo "GitHub secret D1_DATABASE_ID is missing or malformed: run scripts/setup-d1.sh" >&2; exit 1 ;;
          esac
          awk -v id="$D1_DATABASE_ID" '{ print } /^database_name = / { print "database_id = \"" id "\"" }' wrangler.toml > wrangler.toml.tmp
          mv wrangler.toml.tmp wrangler.toml
          sed -n '/^\[\[d1_databases\]\]/,/^$/p' wrangler.toml
      - name: Require notification and authentication settings
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL }}
        run: |
          for name in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URL; do
            if [ -z "$(printenv "$name")" ]; then
              echo "GitHub secret $name is missing: see docs/persistence-auth.md and docs/ci-cd.md" >&2
              exit 1
            fi
          done
          case "$GOOGLE_REDIRECT_URL" in
            https://*/auth/google/callback) ;;
            *) echo "GOOGLE_REDIRECT_URL must be an https URL ending in /auth/google/callback" >&2; exit 1 ;;
          esac
      - name: Apply D1 migrations before deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.152.0 d1 migrations apply app --remote
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL }}
        with:
          # The action's default Wrangler 3 cannot read `[exports.Hub]`.
          wranglerVersion: "4.152.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          vars: |
            VAPID_PUBLIC_KEY
            GOOGLE_CLIENT_ID
            GOOGLE_REDIRECT_URL
          secrets: |
            VAPID_PRIVATE_KEY
            VAPID_SUBJECT
            GOOGLE_CLIENT_SECRET
      - name: Show the Wrangler log
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          for log in ~/.config/.wrangler/logs/*.log; do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$URL" ]; then
            echo "wrangler-action returned no deployment-url" >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$URL/manifest.webmanifest" > /dev/null
