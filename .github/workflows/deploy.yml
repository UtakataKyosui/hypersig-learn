name: Deploy

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: worker-release
          cache-all-crates: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require notification and authentication settings
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL }}
        run: |
          for name in VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REDIRECT_URL; do
            if [ -z "$(printenv "$name")" ]; then
              echo "GitHub secret $name is missing: see docs/persistence-auth.md and docs/ci-cd.md" >&2
              exit 1
            fi
          done
          case "$GOOGLE_REDIRECT_URL" in
            https://*/auth/google/callback) ;;
            *) echo "GOOGLE_REDIRECT_URL must be an https URL ending in /auth/google/callback" >&2; exit 1 ;;
          esac
      - name: Apply D1 migrations before deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: npx --no-install cf d1 migrations apply "$D1_DATABASE_ID"
      - name: Build and validate production output
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL }}
        run: |
          npx --no-install cf build --mode production
          npx --no-install cf deploy --prebuilt --mode production --dry-run --no-provision
      - name: Deploy with cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL }}
        run: |
          secret_file=$(mktemp "$RUNNER_TEMP/cf-secrets.XXXXXX")
          trap 'rm -f "$secret_file"' EXIT
          CF_SECRETS_FILE="$secret_file" node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const names = ['VAPID_PRIVATE_KEY', 'VAPID_SUBJECT', 'GOOGLE_CLIENT_SECRET'];
          writeFileSync(process.env.CF_SECRETS_FILE,
            JSON.stringify(Object.fromEntries(names.map(name => [name, process.env[name]]))),
            { mode: 0o600 });
          JS
          npx --no-install cf deploy --prebuilt --mode production --no-provision --secrets-file "$secret_file"
      - name: Smoke test
        env:
          GOOGLE_REDIRECT_URL: ${{ secrets.GOOGLE_REDIRECT_URL }}
        run: |
          URL=$(node -e 'console.log(new URL(process.env.GOOGLE_REDIRECT_URL).origin)')
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "$URL/manifest.webmanifest" > /dev/null
